# B4 (qa227, 29 Oct 2026): Helio-dispatched provider-managed release workflow (test -> production).
#
# Owned fixture of QA-guide worker B4 (close/overrides/policy and administration cases). Helio dispatches this
# workflow from the pinned tag helio/workflow/<sha>; every push is tagged in the same step by agents/b4/lane.py.
# Both environments have the B4 lane's Helio reviewer as their only required reviewer; admin bypass is off.
# Behaviour switches are repository variables so a fixture needs no commit:
#   B4_TEST_MODE   fail (test job fails -> failure lock, TC-106) | timeout | '' (pass)
#   B4_TEST_SLEEP  seconds the test job works (default 40; raise it to hold a stage open, TC-113)
# Every job prints the non-secret variables GitHub hands it (repository + environment variables), so a run
# shows what a Helio variable-set assignment delivered (TC-293). No secret is ever printed.
# The production job records one synthetic GitHub deployment; no application is deployed.
name: b4-provider
run-name: ${{ inputs.helio_execution_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b4-gov-test
        options: [b4-gov-test, b4-gov-production]
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      helio_stage_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''
      # TC-293: Helio delivers assigned variable-set values only to inputs the workflow declares (non-secret strings).
      B4_COLOR:
        type: string
        required: false
        default: ''
      B4_COUNT:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: b4-provider-${{ inputs.helio_execution_id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.B4_TEST_MODE == 'timeout' && 1 || 30 }}
    environment: b4-gov-test
    steps:
      - name: Variables delivered to this job (non-secret)
        shell: bash
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "B4_VARS_BEGIN"; printf '%s\n' "$VARS_JSON"; echo "B4_VARS_END"
          echo "B4_INPUTS_BEGIN"; printf '%s\n' "$INPUTS_JSON"; echo "B4_INPUTS_END"
          env | grep -E '^HELIO_' | sort || true
      - name: Synthetic test work
        shell: bash
        env:
          MODE: ${{ vars.B4_TEST_MODE }}
          SLEEP_SECONDS: ${{ vars.B4_TEST_SLEEP || '40' }}
        run: |
          set -euo pipefail
          echo "b4-provider test: run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          if [ "$MODE" = "timeout" ]; then sleep 150; fi
          sleep "$SLEEP_SECONDS"
          if [ "$MODE" = "fail" ]; then echo "B4_TEST_MODE=fail: synthetic test failure"; exit 1; fi
          echo "synthetic tests passed"

  production:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: b4-gov-production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Variables delivered to this job (non-secret)
        shell: bash
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "B4_VARS_BEGIN"; printf '%s\n' "$VARS_JSON"; echo "B4_VARS_END"
          env | grep -E '^HELIO_' | sort || true
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: b4-gov-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sleep 10
          python3 - <<'PY'
          import hashlib, json, os, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          revision = os.environ["WORKFLOW_REVISION"] or os.environ["GITHUB_SHA"]
          assert revision == os.environ["GITHUB_SHA"], "workflow_revision must equal the executing commit"
          body = json.dumps({"application": "b4-provider", "version": os.environ["RELEASE_VERSION"],
                             "commit": os.environ["GITHUB_SHA"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}, sort_keys=True).encode()
          digest = "sha256:" + hashlib.sha256(body).hexdigest()
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"],
                     "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest,
                     "artifact_uri": "urn:b4-provider@" + digest,
                     "rollback_workflow_id": ".github/workflows/b4-provider.yml", "workflow_revision": revision}
          json.dump({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [],
                     "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release",
                     "payload": payload}, open("deployment-evidence.json", "w"))
          print("deploying", digest)
          PY
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          deployment_id="$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments" --data @deployment-evidence.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/deployments/$deployment_id/statuses" --data '{"state":"success","description":"Synthetic deployment evidence; no application deployed"}' > /dev/null
